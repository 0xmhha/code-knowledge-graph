name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  arch: amd64, goos: linux }
          - { os: macos-latest,   arch: arm64, goos: darwin }
          # macos-13 (Intel/amd64) dropped: GitHub-hosted runner pool is
          # effectively retired — jobs sit in `queued` indefinitely.
          # amd64 coverage is provided by ubuntu-latest; arm64 darwin
          # by macos-latest. Re-add macos-13-large (paid) if Intel macOS
          # runtime testing becomes required.
          # Windows support is dropped for now: cli-wrapper (used by
          # internal/eval) calls syscall.Socketpair without a build
          # constraint, which is unix-only. Re-evaluate once cli-wrapper
          # has a Windows-compatible transport or eval is gated off.
    runs-on: ${{ matrix.os }}
    env:
      GOOS:   ${{ matrix.goos }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd web/viewer-next && npm ci && npm run build
      - shell: bash
        run: |
          rm -rf internal/server/web_assets
          mkdir -p internal/server/web_assets
          cp -R web/viewer-next/out/. internal/server/web_assets/
      - run: go build -o bin/ckg ./cmd/ckg

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd web/viewer-next && npm ci && npx playwright install --with-deps chromium && npm run build
      - run: |
          rm -rf internal/server/web_assets
          mkdir -p internal/server/web_assets
          cp -R web/viewer-next/out/. internal/server/web_assets/
          go build -o bin/ckg ./cmd/ckg
          ./bin/ckg build --src=testdata/synthetic --out=/tmp/ckg-smoke
          ./bin/ckg serve --graph=/tmp/ckg-smoke --port=8787 &
          sleep 3
          cd web/viewer-next && npx playwright test
