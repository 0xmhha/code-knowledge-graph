id: T01-newblockchain-callers
corpus: go-stablenet
corpus_path: ${STABLENET_SRC}/core
description: |
  List every Go function or method in this codebase that DIRECTLY calls
  core.NewBlockChain (depth = 1, no transitive callers). Return the
  fully qualified names only, one per line, no commentary
expected_kind: symbol_set
expected:
  symbols:
    - eth.New
    - tests.BlockTest.Run
    - utils.MakeChain
scoring:
  type: precision_recall
  threshold:
    precision: 0.7
    recall: 0.7
