id: MCKV05-keyword-password-go
description: |
  Mirror of ckv fixture q37 (intent -> keyword, Go): "password must contain a
  digit and an uppercase letter". Keyword "password" -> CheckPasswordStrength
  via the camelCase search_tokens split.
probe: { tool: search_text, args: { query: "password", language: "go", top_k: 20 } }
expected: { symbols: [ "sample.CheckPasswordStrength" ] }
scoring: { recall_min: 1.0, precision_min: 1.0 }
